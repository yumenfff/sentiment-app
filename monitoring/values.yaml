alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 6h
    resources:
      requests:
        memory: 300Mi
      limits:
        memory: 700Mi
grafana:
  adminPassword: admin
  resources:
    requests:
      memory: 100Mi
    limits:
      memory: 250Mi
